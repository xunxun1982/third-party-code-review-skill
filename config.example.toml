# Copy this file to ~/.config/third-party-code-review-skill/config.toml,
# or %USERPROFILE%\.config\third-party-code-review-skill\config.toml on Windows.
# Keep config.toml untracked and never commit a real API key.

# Use fixed tables named UPSTREAM<number> or UPSTREAM_<name>.
# Enabled tables are evaluated in declaration order. The client sends to the
# first two enabled upstreams concurrently and ignores later enabled tables.
# Each upstream may use a different protocol, model, service base URL or gateway
# mount prefix,
# timeout, and stream mode. Context and output limits follow the upstream.
# Do not include /v1/chat/completions, /v1/responses, or /v1/messages in
# BASE_URL. The client appends the endpoint selected by PROTOCOL.
# Enable streaming by default. Set STREAM to false only when the upstream
# requires one JSON response.

# Plain HTTP is supported only for explicitly trusted internal relays. Keep
# this example disabled until you explicitly accept the cleartext credential risk.
[UPSTREAM_codereview]
ENABLED = false
PROTOCOL = "openai_chat"
BASE_URL = "http://172.28.100.252:10130/proxy/codereview_chat"
MODEL = "codereview"
API_KEY = ""
TIMEOUT_SECONDS = 600
MAX_RETRIES = 3
STREAM = true

[UPSTREAM2]
ENABLED = false
PROTOCOL = "openai_responses"
BASE_URL = "https://api.example.test"
MODEL = "responses-review-model"
API_KEY = ""
TIMEOUT_SECONDS = 600
MAX_RETRIES = 3
STREAM = true

[UPSTREAM3]
ENABLED = false
PROTOCOL = "anthropic"
BASE_URL = "https://gateway.example.test"
MODEL = "claude-review-model"
API_KEY = ""
TIMEOUT_SECONDS = 600
MAX_RETRIES = 3
STREAM = true
